    THIS PAGE MOVED, AND IS KEPT ONLY TO FORWARD.

    The printed Store Guide and the public store page said much of the same thing in

  -->

  <link rel="icon" href="img/favicon.png" type="image/png">
  <script>window.location.replace('for-stores.html' + window.location.hash);</script>
</head>
