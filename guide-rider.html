  <!--
    THIS PAGE MOVED, AND IS KEPT ONLY TO FORWARD.

    The printed Rider Guide and the public rider page said much of the same thing in
    two places, so they are now one page: for-riders.html. Everything that used to be
    here is in it, including the printable sections and the acknowledgement.

    THE URL STAYS BECAUSE IT IS ALREADY IN CIRCULATION -- it is printed on

    refresh, plus a canonical link for search engines, a script for the hash,
    and a visible link for anyone whose browser honours none of them.
  -->
  <link rel="canonical" href="https://paspasfood.com/for-riders.html">
  <meta http-equiv="refresh" content="0; url=for-riders.html">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <script>window.location.replace('for-riders.html' + window.location.hash);</script>
</head>
<body>
  <main style="max-width:640px;margin:0 auto;padding:80px 24px;text-align:center;">
    <h1 style="font-size:24px;font-weight:800;color:var(--dark);margin-bottom:12px;">The Rider Guide has moved</h1>
    <p style="font-size:15px;color:var(--text-light);line-height:1.8;margin-bottom:24px;">

    </p>
    <p><a href="for-riders.html" class="btn btn-primary btn-lg">Open the Rider Guide</a></p>
    <p style="font-size:13px;color:var(--text-light);margin-top:28px;">paspasfood.com/for-riders.html</p>
